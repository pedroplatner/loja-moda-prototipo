<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ateliê Nuvem · Administração</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><style>
:root{--ink:#211d19;--muted:#82776d;--line:#e7dfd5;--paper:#f8f5f0;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#25211e;color:#eee9e1;padding:28px 18px}.brand{font:22px 'Playfair Display';margin:4px 10px 48px}.brand small{display:block;font:10px 'DM Sans';letter-spacing:.22em;color:#bda78e;margin-top:5px}.nav button{display:block;width:100%;padding:13px 12px;margin:3px 0;text-align:left;border:0;background:transparent;color:#bdb3a9;border-radius:4px;cursor:pointer}.nav button.active,.nav button:hover{background:#3c3530;color:#fff}.back{display:block;color:#a99d92;text-decoration:none;font-size:12px;margin:55px 10px}.main{padding:34px 5vw;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:#a0785b}.top h1{font:34px 'Playfair Display';margin:7px 0 0}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}.stat,.panel{background:var(--card);border:1px solid var(--line);padding:20px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:9px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel h2{font:22px 'Playfair Display';margin:0}.button{border:0;background:#28231f;color:white;padding:11px 15px;text-transform:uppercase;letter-spacing:.1em;font-size:10px;cursor:pointer}.button.alt{background:transparent;border:1px solid #cfc3b7;color:var(--ink)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.badge{font-size:10px;padding:4px 7px;background:#edf0e8;color:#52634d}.empty{padding:30px;text-align:center;color:var(--muted)}form.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-width:700px}label{font-size:11px;color:var(--muted)}input,select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);background:#fff;font:inherit}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:5px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{padding:15px;display:flex;align-items:center;gap:20px}.brand{margin:0}.nav{display:flex;flex:1}.nav button{padding:9px}.back{display:none}.main{padding:24px 16px}.stats{grid-template-columns:1fr 1fr}.top h1{font-size:28px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">ATELIÊ NUVEM<small>ADMINISTRAÇÃO</small></div><nav class="nav"><button class="active" data-view="overview">Visão geral</button><button data-view="products">Produtos</button><button data-view="orders">Pedidos</button></nav><a class="back" href="/">← Voltar para a loja</a></aside><main class="main"><div class="top"><div><div class="eyebrow">painel interno</div><h1 id="title">Visão geral</h1></div><div id="sync" class="eyebrow">conectando...</div></div><section class="view active" id="overview"><div class="stats"><div class="stat"><span>Produtos ativos</span><strong id="stat-products">—</strong></div><div class="stat"><span>Pedidos registrados</span><strong id="stat-orders">—</strong></div><div class="stat"><span>Vendas em pedidos</span><strong id="stat-sales">—</strong></div><div class="stat"><span>Pedidos pendentes</span><strong id="stat-pending">—</strong></div></div><div class="panel"><div class="panel-head"><h2>Últimos pedidos</h2><button class="button alt" data-go="orders">ver todos</button></div><div id="recent-orders"></div></div></section><section class="view" id="products"><div class="panel"><div class="panel-head"><h2>Catálogo</h2><button class="button" id="new-product">+ novo produto</button></div><div id="product-form-wrap" hidden><form id="product-form" class="grid"><input type="hidden" name="id"><label>Nome<input name="name" required></label><label>Preço<input name="price" type="number" step="0.01" min="0" required></label><label>Categoria<select name="category"><option>vestidos</option><option>conjuntos</option><option>essenciais</option></select></label><label>Imagem URL<input name="image" type="url" required></label><label>Tamanhos<input name="sizes" placeholder="P, M, G"></label><label>Cores<input name="colors" placeholder="Preto, Areia"></label><label class="full"><input name="available" type="checkbox" checked style="display:inline;width:auto"> Disponível</label><div class="form-actions full"><button class="button alt" type="button" id="cancel">cancelar</button><button class="button">salvar</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"></div><div id="products-table"></div></div></section><section class="view" id="orders"><div class="panel"><div class="panel-head"><h2>Pedidos</h2></div><div id="orders-table"></div></div></section></main></div><script src="adm.js"></script></body></html>
